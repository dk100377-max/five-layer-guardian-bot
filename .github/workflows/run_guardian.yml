name: Five-Layer Guardian System

on:
  workflow_dispatch:  # 允許你隨時在網頁一鍵手動啟動
  schedule:
    - cron: '0 */4 * * *'  # 每 4 小時自動醒來巡檢一次市場與新聞

permissions:
  contents: write  # 賦予系統「永久記憶權限」，自動把結果與日誌寫回倉庫

jobs:
  run-system:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 讀取上次記憶 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 2. 準備雲端 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安裝開源分析套件
        run: pip install -r requirements.txt

      - name: 4. 執行系統 B 決策與競賽引擎
        run: python guardian_engine.py

      - name: 5. 寫入永久記憶與交易日誌 (Auto-Save to GitHub)
        run: |
          git config --global user.name "Guardian-Bot"
          git config --global user.email "bot@://github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-save system B memory & report" && git push)
