name: Five-Layer Guardian System

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # 改為每 1 小時整點收盤準時巡檢一次

permissions:
  contents: write

jobs:
  run-system:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 讀取上次記憶 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 2. 準備雲端 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安裝開源分析套件
        run: pip install -r requirements.txt

      - name: 4. 執行系統 B 決策與競賽引擎 (4H+1H 雙週期)
        run: python guardian_engine.py

      - name: 5. 寫入永久記憶與交易日誌 (Auto-Save to GitHub)
        run: |
          git config --global user.name "Guardian-Bot"
          git config --global user.email "bot@://github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Hourly 4H+1H scan & memory save" && git push)
