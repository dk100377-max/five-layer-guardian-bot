name: Five-Layer Guardian System

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  run-system:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 讀取上次記憶 (Checkout Repository)
        uses: actions/checkout@v4

      - name: 2. 準備雲端 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安裝開源分析套件
        run: pip install -r requirements.txt

      - name: 4. 執行三幣種決策與 Telegram 推播引擎
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python guardian_engine.py

      - name: 5. 寫入永久記憶與交易日誌 (Auto-Save to GitHub)
        run: |
          git config --global user.name "Guardian-Bot"
          git config --global user.email "bot@://github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Hourly BTC/ETH/SOL scan & TG alert" && git push)
